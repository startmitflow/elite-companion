services:
  postgres:
    image: postgres:16-alpine
    container_name: elite-companion-db
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite_secret
      POSTGRES_DB: elite_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_companion"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elite-companion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: