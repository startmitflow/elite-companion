services:
  - type: web
    name: elite-companion-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elite-companion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://elite-companion.onrender.com

  - type: web
    name: elite-companion
    env: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://elite-companion-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://elite-companion-api.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://elite-companion-api.onrender.com/auth/*
      - type: rewrite
        source: /socket.io/*
        destination: https://elite-companion-api.onrender.com/socket.io/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: elite-companion-db
    databaseName: elite_companion
    user: elite